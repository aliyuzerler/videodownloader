name: Build and Archive iOS App

on:
  workflow_dispatch:  # Manuel tetikleme
    inputs:
      version:
        description: 'Version number (e.g., 1.0.7)'
        required: false
        type: string
      build_number:
        description: 'Build number (auto-increment if empty)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'  # v1.0.0 gibi tag'ler için

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false  # Submodule'leri atla (git hatasını önler)
        fetch-depth: 0  # Tüm commit geçmişini al
    
    - name: Fix submodule issues
      run: |
        # SwipeCardsKit submodule sorununu çöz
        if [ -d "SwipeCardsKit/.git" ]; then
          echo "🔧 SwipeCardsKit submodule sorunu düzeltiliyor..."
          rm -rf SwipeCardsKit/.git
          git add SwipeCardsKit || true
        fi
        # .gitmodules dosyasını kontrol et ve gerekirse oluştur
        if [ ! -f ".gitmodules" ] && [ -d "SwipeCardsKit" ]; then
          echo "⚠️ .gitmodules dosyası yok, SwipeCardsKit normal klasör olarak kullanılacak"
        fi
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Setup Keychain for Code Signing
      run: |
        # Keychain oluştur ve ayarla (otomatik signing için gerekli)
        security create-keychain -p "" build.keychain || true
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security list-keychains -d user -s build.keychain
        echo "✅ Keychain hazırlandı"
    
    - name: Update version and build number
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          plutil -replace CFBundleShortVersionString -string "${{ github.event.inputs.version }}" VideoDownloader/Info.plist || true
        fi
        
        BUILD_NUMBER="${{ github.event.inputs.build_number }}"
        if [ -z "$BUILD_NUMBER" ]; then
          BUILD_NUMBER="${{ github.run_number }}"
        fi
        # Build number'ı güncellemek için project.pbxproj dosyasını düzenlemeniz gerekebilir
        # Bu adım opsiyoneldir, Xcode build settings'ten de yapılabilir
    
    - name: Build and Archive
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Build klasörünü oluştur
        mkdir -p ./build
        
        # TEAM_ID kontrolü
        if [ -z "$TEAM_ID" ]; then
          echo "❌ TEAM_ID secret'ı bulunamadı!"
          echo "📋 GitHub Secrets'a TEAM_ID ekleyin: NJRDK44KQ5"
          exit 1
        fi
        echo "✅ TEAM_ID: $TEAM_ID"
        
        # Proje yapısını kontrol et
        if [ -f "VideoDownloader.xcworkspace/contents.xcworkspacedata" ]; then
          echo "📦 Workspace bulundu, workspace ile build alınıyor..."
          xcodebuild clean archive \
            -workspace VideoDownloader.xcworkspace \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath ./build/VideoDownloader.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            -destination "generic/platform=iOS" \
            2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
        else
          echo "📦 Project bulundu, project ile build alınıyor..."
          xcodebuild clean archive \
            -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath ./build/VideoDownloader.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            -destination "generic/platform=iOS" \
            2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
        fi
        
        # Build sonucunu kontrol et
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "❌ Build başarısız! Exit code: $BUILD_EXIT_CODE"
          echo "📋 Build log (son 100 satır):"
          tail -100 build.log
          echo ""
          echo "📋 Build log (hata mesajları):"
          grep -i "error" build.log | tail -20 || echo "Hata mesajı bulunamadı"
          exit 1
        fi
        
        # Archive'nin oluşturulduğunu kontrol et
        if [ ! -d "./build/VideoDownloader.xcarchive" ]; then
          echo "❌ Archive oluşturulamadı!"
          echo "📋 Build log (son 50 satır):"
          tail -50 build.log
          exit 1
        fi
        
        echo "✅ Archive başarıyla oluşturuldu!"
        echo "📦 Archive yolu: ./build/VideoDownloader.xcarchive"
        ls -lh ./build/VideoDownloader.xcarchive
    
    - name: Export IPA
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Export klasörünü kontrol et
        echo "🔍 Archive kontrolü yapılıyor..."
        if [ ! -d "./build/VideoDownloader.xcarchive" ]; then
          echo "❌ Archive bulunamadı!"
          echo "📋 Build klasörü içeriği:"
          ls -la ./build/ || echo "Build klasörü yok"
          exit 1
        fi
        echo "✅ Archive bulundu!"
        
        # TEAM_ID kontrolü
        if [ -z "$TEAM_ID" ]; then
          echo "⚠️ TEAM_ID secret'ı bulunamadı!"
          echo "📋 GitHub Secrets'a TEAM_ID ekleyin: NJRDK44KQ5"
          echo "📦 Archive mevcut, ancak IPA export edilemiyor."
          echo "💡 Alternatif: Archive'ı artifact olarak yükleyebilirsiniz (Xcode'da export edebilirsiniz)"
          exit 0  # Hata vermeden devam et, archive'ı yükle
        fi
        echo "✅ TEAM_ID: $TEAM_ID"
        
        # Export klasörünü temizle
        rm -rf ./build/export
        mkdir -p ./build/export
        
        echo "📦 IPA export ediliyor..."
        echo "🔐 Code signing için TEAM_ID kullanılıyor: $TEAM_ID"
        
        # Export işlemini TEAM_ID ile yap
        xcodebuild -exportArchive \
          -archivePath ./build/VideoDownloader.xcarchive \
          -exportOptionsPlist ./exportOptions.plist \
          -exportPath ./build/export \
          -allowProvisioningUpdates \
          2>&1 | tee export.log
        
        EXPORT_EXIT_CODE=${PIPESTATUS[0]}
        
        if [ $EXPORT_EXIT_CODE -ne 0 ]; then
          echo "❌ Export başarısız! Exit code: $EXPORT_EXIT_CODE"
          echo "📋 Export log (son 100 satır):"
          tail -100 export.log
          echo ""
          echo "📋 Export log (hata mesajları):"
          grep -i "error" export.log | tail -20 || echo "Hata mesajı bulunamadı"
          echo ""
          echo "⚠️ Code signing hatası! Apple Developer hesabı gerekli."
          echo "📋 Çözüm: GitHub Secrets'a APPLE_ID ve APPLE_APP_SPECIFIC_PASSWORD ekleyin"
          echo "💡 Alternatif: Archive'ı artifact olarak yükleyebilirsiniz (Xcode'da export edebilirsiniz)"
          # Hata vermeden devam et, archive'ı yükle
        else
          # IPA dosyasını bul ve build klasörüne taşı
          echo "🔍 IPA dosyası aranıyor..."
          if [ -f "./build/export/VideoDownloader.ipa" ]; then
            mv ./build/export/VideoDownloader.ipa ./build/VideoDownloader.ipa
            echo "✅ IPA dosyası bulundu ve taşındı!"
            ls -lh ./build/VideoDownloader.ipa
          else
            # Tüm .ipa dosyalarını ara
            IPA_FILE=$(find ./build/export -name "*.ipa" -type f | head -1)
            if [ -n "$IPA_FILE" ]; then
              mv "$IPA_FILE" ./build/VideoDownloader.ipa
              echo "✅ IPA dosyası bulundu ve taşındı: $IPA_FILE"
              ls -lh ./build/VideoDownloader.ipa
            else
              echo "⚠️ IPA dosyası beklenen yerde bulunamadı"
              echo "📋 Export klasörü içeriği:"
              ls -la ./build/export/ || echo "Export klasörü yok"
              echo "📋 Tüm alt klasörler:"
              find ./build -name "*.ipa" -type f 2>/dev/null || echo "IPA dosyası bulunamadı"
              echo "💡 Alternatif: Archive'ı artifact olarak yükleyebilirsiniz (Xcode'da export edebilirsiniz)"
            fi
          fi
        fi
    
    - name: Upload IPA as artifact
      if: hashFiles('build/VideoDownloader.ipa') != ''
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-${{ github.run_number }}
        path: build/VideoDownloader.ipa
        retention-days: 30
        if-no-files-found: error
    
    - name: Upload Archive as artifact (if IPA export failed)
      if: hashFiles('build/VideoDownloader.ipa') == ''
      uses: actions/upload-artifact@v4
      with:
        name: ios-archive-${{ github.run_number }}
        path: build/VideoDownloader.xcarchive
        retention-days: 30
        if-no-files-found: warn
    
    - name: Build Summary
      run: |
        echo "✅ Build tamamlandı!"
        if [ -f "./build/VideoDownloader.ipa" ]; then
          echo "📦 IPA dosyası artifact olarak yüklendi"
          echo "📥 Artifacts bölümünden 'ios-app-${{ github.run_number }}' dosyasını indirebilirsiniz"
          ls -lh ./build/VideoDownloader.ipa
        else
          echo "⚠️ IPA export edilemedi (code signing hatası)"
          echo "📦 Archive dosyası artifact olarak yüklendi"
          echo "📥 Artifacts bölümünden 'ios-archive-${{ github.run_number }}' dosyasını indirebilirsiniz"
          echo "💡 Xcode'da archive'ı açıp manuel olarak export edebilirsiniz"
          ls -lh ./build/VideoDownloader.xcarchive || echo "Archive bulunamadı"
        fi

