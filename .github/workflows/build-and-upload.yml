name: Build and Archive iOS App

on:
  workflow_dispatch:  # Manuel tetikleme
    inputs:
      version:
        description: 'Version number (e.g., 1.0.7)'
        required: false
        type: string
      build_number:
        description: 'Build number (auto-increment if empty)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'  # v1.0.0 gibi tag'ler için

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false  # Submodule'leri atla (git hatasını önler)
        fetch-depth: 0  # Tüm commit geçmişini al
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Setup Keychain for Code Signing
      run: |
        # Keychain oluştur ve ayarla (otomatik signing için gerekli)
        security create-keychain -p "" build.keychain || true
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security list-keychains -d user -s build.keychain
        echo "✅ Keychain hazırlandı"
    
    - name: Update version and build number
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          plutil -replace CFBundleShortVersionString -string "${{ github.event.inputs.version }}" VideoDownloader/Info.plist || true
        fi
        
        BUILD_NUMBER="${{ github.event.inputs.build_number }}"
        if [ -z "$BUILD_NUMBER" ]; then
          BUILD_NUMBER="${{ github.run_number }}"
        fi
        # Build number'ı güncellemek için project.pbxproj dosyasını düzenlemeniz gerekebilir
        # Bu adım opsiyoneldir, Xcode build settings'ten de yapılabilir
    
    - name: Build and Archive
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Build klasörünü oluştur
        mkdir -p ./build
        
        # TEAM_ID kontrolü
        if [ -z "$TEAM_ID" ]; then
          echo "❌ TEAM_ID secret'ı bulunamadı!"
          echo "📋 GitHub Secrets'a TEAM_ID ekleyin: NJRDK44KQ5"
          exit 1
        fi
        echo "✅ TEAM_ID: $TEAM_ID"
        
        # Proje yapısını kontrol et
        if [ -f "VideoDownloader.xcworkspace/contents.xcworkspacedata" ]; then
          echo "📦 Workspace bulundu, workspace ile build alınıyor..."
          xcodebuild clean archive \
            -workspace VideoDownloader.xcworkspace \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath ./build/VideoDownloader.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic" \
            -destination "generic/platform=iOS" \
            2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
        else
          echo "📦 Project bulundu, project ile build alınıyor..."
          xcodebuild clean archive \
            -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath ./build/VideoDownloader.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic" \
            -destination "generic/platform=iOS" \
            2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
        fi
        
        # Build sonucunu kontrol et
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "❌ Build başarısız! Exit code: $BUILD_EXIT_CODE"
          echo "📋 Build log (son 100 satır):"
          tail -100 build.log
          echo ""
          echo "📋 Build log (hata mesajları):"
          grep -i "error" build.log | tail -20 || echo "Hata mesajı bulunamadı"
          exit 1
        fi
        
        # Archive'nin oluşturulduğunu kontrol et
        if [ ! -d "./build/VideoDownloader.xcarchive" ]; then
          echo "❌ Archive oluşturulamadı!"
          echo "📋 Build log (son 50 satır):"
          tail -50 build.log
          exit 1
        fi
        
        echo "✅ Archive başarıyla oluşturuldu!"
        echo "📦 Archive yolu: ./build/VideoDownloader.xcarchive"
        ls -lh ./build/VideoDownloader.xcarchive
    
    - name: Export IPA
      run: |
        # Export klasörünü kontrol et
        echo "🔍 Archive kontrolü yapılıyor..."
        if [ ! -d "./build/VideoDownloader.xcarchive" ]; then
          echo "❌ Archive bulunamadı!"
          echo "📋 Build klasörü içeriği:"
          ls -la ./build/ || echo "Build klasörü yok"
          exit 1
        fi
        echo "✅ Archive bulundu!"
        
        echo "📦 IPA export ediliyor..."
        xcodebuild -exportArchive \
          -archivePath ./build/VideoDownloader.xcarchive \
          -exportOptionsPlist ./exportOptions.plist \
          -exportPath ./build \
          2>&1 | tee export.log || {
            echo "❌ Export başarısız!"
            echo "📋 Export log:"
            tail -100 export.log
            exit 1
          }
        
        echo "✅ IPA başarıyla export edildi!"
        ls -lh ./build/*.ipa || echo "⚠️ IPA dosyası bulunamadı"
    
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-${{ github.run_number }}
        path: build/*.ipa
        retention-days: 30
    
    - name: Build Summary
      run: |
        echo "✅ Build tamamlandı!"
        echo "📦 IPA dosyası artifact olarak yüklendi"
        echo "📥 Artifacts bölümünden indirebilirsiniz"
        ls -lh ./build/*.ipa || echo "IPA dosyası bulunamadı"

