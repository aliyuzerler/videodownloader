name: Build and Archive iOS App

on:
  workflow_dispatch:  # Manuel tetikleme
    inputs:
      version:
        description: 'Version number (e.g., 1.0.7)'
        required: false
        type: string
      build_number:
        description: 'Build number (auto-increment if empty)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'  # v1.0.0 gibi tag'ler için

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Update version and build number
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          plutil -replace CFBundleShortVersionString -string "${{ github.event.inputs.version }}" VideoDownloader/Info.plist || true
        fi
        
        BUILD_NUMBER="${{ github.event.inputs.build_number }}"
        if [ -z "$BUILD_NUMBER" ]; then
          BUILD_NUMBER="${{ github.run_number }}"
        fi
        # Build number'ı güncellemek için project.pbxproj dosyasını düzenlemeniz gerekebilir
        # Bu adım opsiyoneldir, Xcode build settings'ten de yapılabilir
    
    - name: Build and Archive
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Proje yapısını kontrol et
        if [ -f "VideoDownloader.xcworkspace/contents.xcworkspacedata" ]; then
          echo "📦 Workspace bulundu, workspace ile build alınıyor..."
          xcodebuild clean archive \
            -workspace VideoDownloader.xcworkspace \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath ./build/VideoDownloader.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic"
        else
          echo "📦 Project bulundu, project ile build alınıyor..."
          xcodebuild clean archive \
            -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath ./build/VideoDownloader.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic"
        fi
    
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath ./build/VideoDownloader.xcarchive \
          -exportOptionsPlist ./exportOptions.plist \
          -exportPath ./build
    
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-${{ github.run_number }}
        path: build/*.ipa
        retention-days: 30
    
    - name: Build Summary
      run: |
        echo "✅ Build tamamlandı!"
        echo "📦 IPA dosyası artifact olarak yüklendi"
        echo "📥 Artifacts bölümünden indirebilirsiniz"
        ls -lh ./build/*.ipa || echo "IPA dosyası bulunamadı"

